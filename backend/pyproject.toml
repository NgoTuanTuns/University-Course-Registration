[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
timeout = 30
addopts = "--strict-markers --cov=app --cov-report=term-missing"
markers = [
    "unit: logic thuần, không phụ thuộc dịch vụ ngoài",
    "integration: kiểm thử API cùng PostgreSQL hoặc Redis",
    "concurrency: kiểm thử tranh chấp đồng thời",
    "stress: kiểm thử tải hoặc nhiều dữ liệu",
    "slow: kiểm thử chạy lâu",
    "e2e: kiểm thử luồng trình duyệt",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"



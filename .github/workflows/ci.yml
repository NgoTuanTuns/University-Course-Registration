name: CI

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend lint, migrations, tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15.16-alpine3.23
        env:
          POSTGRES_USER: course_user
          POSTGRES_PASSWORD: ${{ github.run_id }}
          POSTGRES_DB: course_reg
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U course_user -d course_reg"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7.4.12-alpine3.21
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      APP_ENV: test
      POSTGRES_USER: course_user
      POSTGRES_PASSWORD: ${{ github.run_id }}
      POSTGRES_DB: course_reg
      TEST_POSTGRES_DB: course_reg_test
      DATABASE_URL: postgresql+asyncpg://course_user:${{ github.run_id }}@localhost:5432/course_reg
      TEST_DATABASE_URL: postgresql+asyncpg://course_user:${{ github.run_id }}@localhost:5432/course_reg_test
      REDIS_URL: redis://localhost:6379/0
      TEST_REDIS_URL: redis://localhost:6379/1
      JWT_SECRET: ci-only-not-a-real-secret-value
      DB_POOL_SIZE: 5
      DB_MAX_OVERFLOW: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Create isolated test database
        run: |
          PGPASSWORD="$POSTGRES_PASSWORD" psql -h localhost -U "$POSTGRES_USER" -d postgres -c "CREATE DATABASE $TEST_POSTGRES_DB OWNER $POSTGRES_USER"
      - name: Ruff lint
        working-directory: backend
        run: ruff check app tests
      - name: Ruff format
        working-directory: backend
        run: ruff format --check app tests
      - name: Upgrade database
        working-directory: backend
        run: alembic upgrade head
      - name: Check migration/model agreement
        working-directory: backend
        run: alembic check
      - name: OpenAPI contract snapshot
        working-directory: backend
        run: python -m app.tools.openapi_snapshot --check
      - name: Check every test has an explicit marker
        working-directory: backend
        env:
          UNIT_TESTS_ONLY: "1"
        run: |
          set +e
          pytest --collect-only -q -m "not unit and not integration and not concurrency and not stress and not slow and not e2e"
          status=$?
          set -e
          if [ "$status" -eq 5 ]; then
            echo "All collected tests have an explicit marker."
          elif [ "$status" -eq 0 ]; then
            echo "::error::Found tests without an explicit marker."
            exit 1
          else
            exit "$status"
          fi
      - name: Unit tests
        working-directory: backend
        env:
          UNIT_TESTS_ONLY: "1"
        run: pytest -m unit
      - name: Integration and concurrency tests
        working-directory: backend
        run: pytest -m "integration or concurrency"

  detect-frontend:
    name: Detect frontend package
    runs-on: ubuntu-latest
    outputs:
      has_frontend: ${{ steps.detect.outputs.has_frontend }}
    steps:
      - uses: actions/checkout@v7
      - id: detect
        run: |
          if [ -f package.json ]; then
            echo "has_frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_frontend=false" >> "$GITHUB_OUTPUT"
          fi

  frontend:
    name: Frontend lint, tests, and build
    needs: detect-frontend
    if: needs.detect-frontend.outputs.has_frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24.21.0"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test --if-present
      - name: Prettier
        run: |
          if node -e "process.exit(require('./package.json').devDependencies?.prettier ? 0 : 1)"; then
            npm exec prettier -- --check .
          else
            echo "::warning::Prettier is not declared in package.json yet; M1 should add it."
          fi
      - run: npm run build

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
